# ═══════════════════════════════════════════════════════════════════════════════
# 4D HOI Reconstruction — PICKUP (SMPL-X body model)
#
# For dynamic-object HOI: human picks up an object that moves
# during the interaction. Filters out static-object reconstructions at step 5
# (filter_object_motion: dynamic_only) so the output motion library has no
# "human stood next to thing" trivial cases.
# ═══════════════════════════════════════════════════════════════════════════════

# Geometry backend switch. Defaults preserve the original fixed-camera MoGe path.
geometry_backend: "moge" # moge | vggt
camera_mode: "fixed" # fixed | dynamic

vggt:
  checkpoint_path: "imports/vggt-omega/checkpoints/vggt_omega_1b_512.pt"
  image_resolution: 512
  preprocess_mode: "balanced" # balanced | max_size
  sampled: false
  sample_fps: null
  alignment_confidence_percentile: 50.0
  alignment_erode_pixels: 5
  alignment_ransac_threshold_m: 0.03
  alignment_mode: "first_frame_correspondence" # first_frame_correspondence | static_scene_icp | hybrid
  scene_reference_dir: null # e.g. generation/scene_reference/{origin}; output from scripts/export_scene_reference.py
  blender_depth_path: null # optional explicit depth_gt_00000.exr/.png/.npy override
  blender_K_path: null # optional explicit camera_init_K.npy / cam_K.txt override
  blender_c2w_path: null # optional explicit camera_init_c2w.npy / first_frame_pose.pickle override
  static_mask_path: null
  human_mask_path: null
  object_mask_path: null
  static_scene_ply: null
  observation_confidence_percentile: 40.0
  observation_erode_pixels: 5

# ── Directory paths ───────────────────────────────────────────────────────────
paths:
  results_dir: "results"
  video_dir: "generation/videos_kling"
  hmr_dir: "generation/hmr_smplx"
  hmr_cache_dir: "generation/hmr_smplx_cache"
  foundation_pose_dir: "generation/foundation_pose"
  foundation_pose_output_dir: "generation/foundation_pose_output"
  recon_cache_dir: "generation/4dhoi_recon_cache"
  depth_gt_dir: "generation/depth_maps"
  output_dir: "generation/4dhoi_recon_smplx"
  vis_scenepic_dir: "generation/vis_html"

# ── Human model config ────────────────────────────────────────────────────────
human_model:
  body_model: "g1_smplx" # smplx | soma | g1_smplx
  static_cam: true
  smplx_model_path: "imports/GEM-SMPL/inputs/checkpoints/body_models/smplx/SMPLX_NEUTRAL.npz"
  smplx_shape_params_path: "data/RenderPeople_fitsmpl"
  soma_model_path: "imports/GEM-SOMA/inputs/mhr_data/mhr_model.pt"
  soma_shape_params_path: "data/RenderPeople_fitsoma"
  g1_smplx_dir: "data/g1_smplx"

# ── Object pose tracking config ──────────────────────────────────────────────
obj_pose_tracking:
  foundation_pose_debug: 2
  crop_image: true
  interpolation_factor: 2

# ── Optimization config (passed to HOIOptimizer) ─────────────────────────────
optimization:
  log_dir: "logs"
  exp_name: "static_cam"
  use_global: False

  cache_list:
    - contact_labels

  dct_cfg:
    enable: false
    coeff_ratio: 0.15

  vis_cfg:
    vis_init: true
    enable: true
    render_video: true
    extra_views:
      - "top"
    export_mesh: false
    vis_html: true
    vis_contact: true

  # Real Lift4D Gaussian-center camera-Z prior. Formal runs supervise every frame
  # and preserve FoundationPose image-plane position and rotation.
  use_lift4d_depth_prior: false
  lift4d_motion:
    enabled: false
    source: "point_trajectories_cam"
    full_frame: true
    stable_point_count: 2500
    median_window: 7
    savgol_window: 31
    savgol_polyorder: 2
    motion_scale: 1.0
    weight: 30.0
    velocity_weight: 5.0
    acceleration_weight: 20.0
    huber_delta: 0.02
    optimize_depth_only: true
    use_kabsch_pose: false
  lift4d_motion_prior_path: null # required when enabled; no guessed path or fallback
  freeze_foundationpose_image_plane_translation: false
  lift4d_stable_point_count: 2500
  lift4d_median_window: 7
  lift4d_center_smooth_window: 31
  lift4d_savgol_polyorder: 2
  lift4d_min_stable_points: 64
  lift4d_depth_scale: 1.0
  learn_lift4d_depth_scale: false
  lift4d_depth_scale_min: 0.25
  lift4d_depth_scale_max: 4.0
  lift4d_depth_scale_lr: 0.001
  lift4d_depth_lr: 0.01
  max_human_approach_distance: 0.35
  contact:
    frame: null
    hand: "right"
    approach_window: 30
    target_distance: 0.02

  human_precontact_approach_opt:
    enabled: false
    niter: 600
    approach_window: 30
    max_approach_distance: 0.35
    opt_vars:
      human_approach_distance:
        lr: 0.003
      human_pose_res:
        lr: 0.0001
        joint_scope: "lower_body_and_arms"

  # Optimization stages
  opt_stage_specs:
    # Stage 1: Human trajectory optimization
    human_traj_opt:
      opt_vars:
        human_trans_res:
          lr: 0.003
        human_pose_res:
          lr: 0.0001
          joint_scope: "full_body"
      niter: 400
      loss_cfg:
        keypoint_tracking:
          weight: 0.3
          beta: 0.1
        human_smoothness:
          weight: 30.0
          beta: 0.1
        human_traj_reg:
          weight: 10.0
        human_pose_reg:
          weight: 30.0
        human_foot_contact:
          weight: 100.0 # 10.0
        human_global_init_reg:
          weight: 3000.0

    # Stage 2: Human global trajectory optimization
    human_global_traj_opt:
      opt_vars:
        human_trans_global:
          lr: 0.01
          xy_only: true
        human_pose_res:
          lr: 0.0001
          joint_scope: "full_body"
      niter: 1000
      loss_cfg:
        contact:
          weight: 100000.0
          duration: "start"
          threshold: 1.0
        human_smoothness:
          weight: 300.0
          beta: 0.1
        human_pose_reg:
          weight: 30.0
        keypoint_tracking:
          weight: 0.1
          beta: 0.1

    # Stage 3: Object trajectory optimization
    obj_traj_opt:
      opt_vars:
        obj_t_res:
          lr: 0.01
        obj_R_res:
          lr: 0.001
        human_pose_res:
          lr: 0.0001
          joint_scope: "lower_body_and_arms"
      niter: 400
      loss_cfg:
        contact:
          weight: 100000.0
          duration: "all"
          threshold: 1.0
        obj_smoothness:
          weight: 500.0
        obj_rot_reg:
          weight: 10.0
        verts_tracking:
          weight: 0.1
          threshold: 0.1
        lift4d_depth:
          enabled: false
          weight: 30.0
          delta: 0.03
        lift4d_velocity:
          enabled: false
          weight: 5.0
          delta: 0.015
        fp_depth_anchor:
          enabled: false
          weight: 1.0
          delta: 0.02
        obj_depth_smoothness:
          enabled: false
          weight: 0.5
          delta: 0.015
        lift4d_depth_scale_reg:
          enabled: false
          weight: 0.1
      save_motion_progress: false
      motion_progress_interval: 50
      gradient_log_interval: 25

  # Evaluation configuration
  eval:
    contact:
      weight: 100000.0
      duration: "all"
      threshold: 5.0
    verts_tracking:
      weight: 0.1
      threshold: 1.0

# ── Filtering config ────────────────────────────────────────
filtering:
  camera_trans_thr: 0.1
  object_mask_tol: 1.0
  total_mask_tol: 0.4
  human_static_thr: 0
  min_frames: null
  filter_object_motion: "all" # all | static_only | dynamic_only
  object_static_thr: 0.02

# ── Post-processing config ────────────────────────────────────────
post_processing:
  center_at_object: false
  compute_contact_points_nframes_before_inter_start: 24

# ── Pipeline control ─────────────────────────────────────────────────────────
pipeline:
  skip_step1: false
  skip_step2: false
  skip_step3: false
  skip_step4: false
  skip_step5: false
  skip_step6: false
  skip_done: false
  verbose: false
  vis_valid_only: false
  is_static_obj: false
